name: CI and npm Publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  quality:
    defaults:
      run:
        working-directory: dsh-network-settings
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: dsh-network-settings
      - name: Checkout loader 2.0 workspace
        uses: actions/checkout@v6
        with:
          repository: dsh-plugins/dsh-loader
          ref: 009ab1fef86616a4553eb9f43052082cbf9bf45b
          path: dsh-loader
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dsh-network-settings/package-lock.json
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install loader dependencies
        working-directory: dsh-loader
        run: npm install --no-audit --no-fund
      - name: Build loader workspace
        working-directory: dsh-loader
        run: npm run build
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build package
        run: npm run build
      - name: Inspect npm package contents
        run: npm pack --dry-run

  smoke:
    defaults:
      run:
        working-directory: dsh-network-settings
    name: Smoke test (network settings unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: dsh-network-settings
      - name: Checkout loader 2.0 workspace
        uses: actions/checkout@v6
        with:
          repository: dsh-plugins/dsh-loader
          ref: 009ab1fef86616a4553eb9f43052082cbf9bf45b
          path: dsh-loader
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dsh-network-settings/package-lock.json
      - name: Install loader dependencies
        working-directory: dsh-loader
        run: npm install --no-audit --no-fund
      - name: Build loader workspace
        working-directory: dsh-loader
        run: npm run build
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test

  publish:
    name: Publish to npm
    needs: ["quality", "smoke"]
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
    uses: dsh-plugins/dsh-npm-publish/.github/workflows/npm-publish.yml@main
    with:
      package-path: "dsh-network-settings"
      checkout-path: "dsh-network-settings"
      loader-ref: "009ab1fef86616a4553eb9f43052082cbf9bf45b"
      install-command: |
        npm --prefix ../dsh-loader install --no-audit --no-fund
        npm --prefix ../dsh-loader run build
        npm install --no-audit --no-fund
      prepare-command: |
        npm run build
        npm pack --dry-run
      publish-flags: "--access public --provenance"
